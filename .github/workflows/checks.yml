name: Storage and capture checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/SoftTrace.Core.Tests/SoftTrace.Core.Tests.csproj --configuration Release
      - run: dotnet test tests/SoftTrace.App.Tests/SoftTrace.App.Tests.csproj --configuration Release --filter FullyQualifiedName~ActivityCaptureServiceTests
